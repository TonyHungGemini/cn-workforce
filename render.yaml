services:
  - type: web
    name: cn-workforce
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: CN_HOST
        value: 0.0.0.0
      - key: CN_DATA_DIR
        value: /data
      - key: CN_SEED_DEMO
        value: "0"
      - key: CN_ACCESS_CODE
        sync: false
      - key: CN_SECRET_KEY
        generateValue: true
      - key: CN_SYNC_TOKEN
        sync: false
      - key: CN_PUBLIC_URL
        sync: false
      - key: CN_DRIVE_CREDENTIALS_JSON
        sync: false
      - key: CN_BACKUP_FILE_ID
        sync: false
      - key: CN_BACKUP_INTERVAL
        value: "60"
      - key: CN_MASTER_URL
        sync: false
      - key: CN_MASTER_IMAGES_URL
        sync: false
